spring:
  application:
    name: apicenter
  datasource:
    url: jdbc:h2:mem:apicenter;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  integration:
    max-attempts: 5
    retry-worker-fixed-delay-ms: 3000
    signature-tolerance-seconds: 300
    channels:
      PARTNER_A:
        base-url: http://localhost:8101
        auth-token: token-a
        signature-secret: secret-a
        read-timeout-ms: 3000
      PARTNER_B:
        base-url: http://localhost:8102
        auth-token: token-b
        signature-secret: secret-b
        read-timeout-ms: 3000
      ERP:
        base-url: http://localhost:8103
        auth-token: erp-token
        signature-secret: erp-secret
        read-timeout-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
