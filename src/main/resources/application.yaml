spring:
  application:
    name: apicenter
  datasource:
    # API 中心（现行设计）· MySQL（PolarDB，doc/schema.sql 已执行建库）
    # 安全建议：提交前将密码改为环境变量占位，如 password: ${APICENTER_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://pritechdb123.mysql.polardb.rds.aliyuncs.com:3306/apicenter?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false
    username: pritechroot
    password: Pritech123!

server:
  port: 8080

app:
  integration:
    max-attempts: 5
    retry-worker-fixed-delay-ms: 3000
    signature-tolerance-seconds: 300
    channels:
      PARTNER_A:
        base-url: http://localhost:8101
        auth-token: token-a
        signature-secret: secret-a
        read-timeout-ms: 3000
      PARTNER_B:
        base-url: http://localhost:8102
        auth-token: token-b
        signature-secret: secret-b
        read-timeout-ms: 3000
      ERP:
        base-url: http://localhost:8103
        auth-token: erp-token
        signature-secret: erp-secret
        read-timeout-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
