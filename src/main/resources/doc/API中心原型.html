<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 中心 · 交互原型</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --line:#e6e8eb; --text:#1f2329; --muted:#86909c;
    --primary:#2f54eb; --primary-light:#eef1fd; --success:#0aa05a; --warn:#d48806;
    --danger:#d4380d; --sidebar:#1d2129; --sidebar-text:#c9cdd4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  .layout{display:flex;min-height:100vh}
  /* 侧边栏 */
  .sidebar{width:200px;background:var(--sidebar);color:var(--sidebar-text);flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
  .logo{height:56px;display:flex;align-items:center;gap:8px;padding:0 20px;font-size:16px;font-weight:700;color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--primary)}
  .menu{padding:12px 8px;display:flex;flex-direction:column;gap:4px}
  .menu a{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:6px;color:var(--sidebar-text);cursor:pointer;text-decoration:none;transition:.15s}
  .menu a:hover{background:rgba(255,255,255,.06);color:#fff}
  .menu a.active{background:var(--primary);color:#fff}
  .menu a .ico{width:16px;text-align:center;font-size:14px}
  .sidebar .foot{margin-top:auto;padding:16px 20px;font-size:12px;color:#5f6672}
  /* 内容区 */
  .content{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 24px;position:sticky;top:0;z-index:10}
  .topbar .crumb{color:var(--muted)}
  .topbar .crumb a{color:var(--primary);cursor:pointer;text-decoration:none}
  .topbar .title{font-size:16px;font-weight:600}
  .page{padding:24px}
  .view{display:none}
  .view.active{display:block}
  /* 组件 */
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .stat-card{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
  .stat-card .label{color:var(--muted);font-size:13px}
  .stat-card .value{font-size:28px;font-weight:700;margin-top:6px}
  .stat-card .sub{color:var(--muted);font-size:12px;margin-top:4px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:16px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
  .panel-head h3{font-size:15px}
  .panel-body{padding:8px 0}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:500;font-size:12px;background:#fafbfc}
  tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#f7f8fa}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500}
  .badge.success{background:#e8f7ef;color:var(--success)}
  .badge.warn{background:#fff7e6;color:var(--warn)}
  .badge.danger{background:#fff1f0;color:var(--danger)}
  .badge.gray{background:#f2f3f5;color:var(--muted)}
  .badge.primary{background:var(--primary-light);color:var(--primary)}
  .tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;background:#f2f3f5;color:#4e5969;margin-right:6px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid transparent;cursor:pointer;font-size:14px;transition:.15s;background:var(--primary);color:#fff}
  .btn:hover{opacity:.9}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--primary);color:var(--primary)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.danger{background:#fff;border-color:#ffccc7;color:var(--danger)}
  .field{margin-bottom:14px}
  .field label{display:block;margin-bottom:6px;color:#4e5969;font-size:13px}
  .field input,.field select,.field textarea{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit;background:#fff}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary)}
  .field .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .keyval{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line)}
  .keyval:last-child{border-bottom:none}
  .keyval .k{color:var(--muted)}
  .keyval .v{font-weight:500;text-align:right;word-break:break-all}
  /* 层级树 */
  .tree-item{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .tree-item:hover{background:#f7f8fa}
  .tree-item .arrow{color:var(--muted);width:16px}
  .tree-item .name{font-weight:500}
  .tree-item .sub{color:var(--muted);font-size:12px}
  .tree-indent{margin-left:28px;border-left:2px solid var(--line)}
  /* 适配器链 */
  .chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:16px}
  .chain .node{background:var(--primary-light);color:var(--primary);border-radius:8px;padding:10px 14px;font-weight:500}
  .chain .node.core{background:#e8f7ef;color:var(--success)}
  .chain .node.end{background:#f2f3f5;color:var(--muted)}
  .chain .arr{color:var(--muted);font-weight:700}
  /* 适配器 tab */
  .tabs{display:flex;gap:8px;padding:14px 18px 0;flex-wrap:wrap}
  .tab{padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--text);cursor:pointer;font-size:13px;transition:.15s}
  .tab:hover{border-color:var(--primary);color:var(--primary)}
  .tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .tab.sm{padding:5px 10px;font-size:12px}
  /* 弹窗 */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:12px;width:520px;max-width:92vw;max-height:88vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.2)}
  .modal.wide{width:780px}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal-head h3{font-size:16px}
  .modal-head .x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
  .modal-body{padding:20px}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .type-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .type-dot.auth{background:#2f54eb}
  .type-dot.protocol{background:#13c2c2}
  .type-dot.message{background:#d48806}
  .type-dot.field{background:#0aa05a}
  .switch{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 10px 3px 3px;cursor:pointer;font-size:12px;color:var(--muted)}
  .switch .knob{width:18px;height:18px;border-radius:50%;background:#d9dce1;transition:.15s}
  .switch .lbl{font-weight:500}
  .switch.on{background:#e8f7ef;border-color:#b7ebd0;color:var(--success)}
  .switch.on .knob{background:var(--success)}
  .pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
  .pager .pager-info{color:var(--muted);font-size:12px}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .params-panel{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fafbfc}
  .rule-row{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;background:#fff}
  .impl-select{position:relative}
  .impl-select-trigger{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .impl-select-trigger:hover{border-color:var(--primary)}
  .impl-select-trigger .caret{color:var(--muted);font-size:12px}
  .impl-select-panel{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:6px;max-height:220px;overflow:auto;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.12);margin-top:4px;display:none}
  .impl-opt{padding:8px 12px;cursor:pointer;font-size:13px}
  .impl-opt:hover{background:#f7f8fa}
  .impl-opt.active{color:var(--primary);background:var(--primary-light)}
  .qmark{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--primary-light);color:var(--primary);font-size:11px;font-weight:600;cursor:help;vertical-align:middle;margin-left:5px}
  .qmark .tip{position:absolute;left:0;bottom:150%;width:230px;background:#1d2129;color:#fff;padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.5;font-weight:400;text-align:left;white-space:normal;display:none;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .qmark:hover .tip,.qmark.open .tip{display:block}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  table.mt{width:100%;border-collapse:collapse;font-size:13px}
  table.mt th,table.mt td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
  table.mt th{background:#fafbfc;font-weight:600;color:var(--muted)}
  table.mt td input,table.mt td select{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:4px;font-size:13px;font-family:inherit;background:#fff}
  table.mt td input:focus,table.mt td select:focus{outline:none;border-color:var(--primary)}
  .bcontrol{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit;background:#fff;color:var(--text)}
  .bcontrol:focus{outline:none;border-color:var(--primary)}
  .btextarea{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit;background:#fff}
  .btextarea:focus{outline:none;border-color:var(--primary)}
</style>
</head>

<div class="layout">
  <aside class="sidebar">

      <a data-view="monitor" onclick="navigate('monitor')"><span class="ico">◎</span>接口监控</a>
      <a data-view="adapters" onclick="navigate('adapters')"><span class="ico">⚙</span>适配器</a>
      <a data-view="appendix" onclick="navigate('appendix')"><span class="ico">✦</span>设计附录</a>
    </nav>
    <div class="foot">API 中心 · 交互原型<br>基于 doc 目录设计方案</div>
  </aside>

  <main class="content">
    <header class="topbar" id="topbar"></header>
    <div class="page">
      <div id="view-dashboard" class="view"></div>
      <div id="view-apps" class="view"></div>
      <div id="view-groups" class="view"></div>
      <div id="view-interfaces" class="view"></div>
      <div id="view-monitor" class="view"></div>
      <div id="view-adapters" class="view"></div>
      <div id="view-appendix" class="view"></div>
    </div>
  </main>
</div>

/* ===== 导航 ===== */
function navigate(view){
  currentView = view;
  currentAppId = null; currentIfId = null;
  document.querySelectorAll('.menu a').forEach(a=>a.classList.toggle('active', a.dataset.view===view));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  renderTopbar(view);
  render(view);
}
function renderTopbar(view, extra){
  const t = VIEW_TITLES[view];
  let html = `<span class="title">${t}</span>`;
  if(view==='apps' && currentAppId){
    const a = state.apps.find(x=>x.appId===currentAppId);
    html = `<span class="crumb"><a onclick="navigate('apps')">应用管理</a> / </span><span class="title">${a ? a.name : ''}</span>`;
  }
  if(view==='interfaces' && currentIfId){
    const i = state.interfaces.find(x=>x.id===currentIfId);
    html = `<span class="crumb"><a onclick="navigate('interfaces')">接口管理</a> / </span><span class="title">${i ? i.name : ''}</span>`;
  }
  document.getElementById('topbar').innerHTML = html;
}
function render(view){
  if(view==='dashboard') renderDashboard();
  else if(view==='apps') renderApps();
  else if(view==='groups') renderGroups();
  else if(view==='interfaces') renderInterfaces();
  else if(view==='monitor') renderMonitor();
  else if(view==='adapters') renderAdapters();
  else if(view==='appendix') renderAppendix();
}

/* ===== 概览 ===== */
function renderDashboard(){
  const s = deriveStats();
  const el = document.getElementById('view-dashboard');
  el.innerHTML = `
    <div class="row">
      <div class="stat-card"><div class="label">应用数</div><div class="value">${state.apps.length}</div><div class="sub">启用 ${state.apps.filter(a=>a.status==='启用').length} 个</div></div>
      <div class="stat-card"><div class="label">接口数</div><div class="value">${state.interfaces.length}</div><div class="sub">已发布 ${state.interfaces.filter(i=>i.status==='已发布').length} 个</div></div>
      <div class="stat-card"><div class="label">今日调用量</div><div class="value">${s.total.toLocaleString()}</div><div class="sub">失败 ${s.fail} 次</div></div>
      <div class="stat-card"><div class="label">成功率</div><div class="value">${s.successRate}%</div><div class="sub">P99 延迟 ${s.p99}ms</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>最近调用</h3><button class="btn sm ghost" onclick="navigate('monitor')">查看全部 →</button></div>
      <div class="panel-body">
        <table><thead><tr><th>时间</th><th>接口</th><th>应用</th><th>状态码</th><th>耗时</th><th>traceId</th></tr></thead>
        <tbody>${state.logs.map(l=>`<tr onclick="navigate('monitor')"><td>${l.time}</td><td>${l.iface}</td><td>${l.app}</td><td>${codeBadge(l.code)}</td><td>${l.ms}ms</td><td>${l.trace}</td></tr>`).join('')}</tbody></table>
      </div>
    </div>`;
}
function codeBadge(c){
  const ok = c>=200 && c<300;
  return `<span class="badge ${ok?'success':'danger'}">${c}</span>`;
}
function deriveStats(){
  const logs = state.logs;
  const total = logs.length;
  const success = logs.filter(l=>l.code>=200 && l.code<300).length;
  const fail = total - success;
  const retrying = logs.filter(l=>l.code===429 || (l.code>=500 && l.code<600 && l.code!==504)).length;
  const deadLetter = logs.filter(l=>l.code>=400 && l.code<500 && l.code!==429).length;
  const unknown = logs.filter(l=>l.code===504).length;
  const ms = logs.map(l=>l.ms).sort((a,b)=>a-b);
  const pct = p => ms.length ? ms[Math.min(ms.length-1, Math.ceil(p*ms.length)-1)] : 0;
  return {
    total, success, fail,
    successRate: total ? (success/total*100).toFixed(1) : '0.0',
    p50: pct(0.5), p99: pct(0.99),
    retrying, deadLetter, unknown
  };
}

function adapterOpts(type, sel){

}
function selectAdapterFilter(type){ adapterTypeFilter = type; adapterPage = 0; renderAdapters(); }
function adapterPageNav(delta){ adapterPage += delta; renderAdapters(); }
function openAdapterModal(id){

function onAdapterTypeChange(){

let implOpen = false;

let codeMapList = [];
function codeMapRowsHtml(boxId){
  const rows = codeMapList.map((m,i)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:6px 0">
      <input value="${m.from}" placeholder="上游错误码，如 10001" style="flex:1" onchange="onCodeMapChange(${i},'from',this.value)">
      <span style="color:var(--muted)">→</span>
      <input value="${m.to}" placeholder="平台错误码，如 50201" style="flex:1" onchange="onCodeMapChange(${i},'to',this.value)">
      <button type="button" class="btn sm danger" onclick="removeCodeMap('${boxId}',${i})">×</button>
    </div>`).join('');
  return (rows || '<div class="empty" style="padding:12px">暂无映射</div>') + `<button type="button" class="btn sm ghost" onclick="addCodeMap('${boxId}')">＋ 添加映射</button>`;
}
function addCodeMap(boxId){ codeMapList.push({ from:'', to:'' }); document.getElementById(boxId).innerHTML = codeMapRowsHtml(boxId); }
function removeCodeMap(boxId, i){ codeMapList.splice(i,1); document.getElementById(boxId).innerHTML = codeMapRowsHtml(boxId); }
function onCodeMapChange(i, field, val){ codeMapList[i][field] = val; }
function paramFieldHtml(f, val, prefix){
  const hint = f.hint ? `<div class="hint">${f.hint}</div>` : '';
  if(f.kind==='select'){
    return `<div class="field"><label>${f.label}</label><select id="${prefix}${f.key}">${(f.options||[]).map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select>${hint}</div>`;
  }
  if(f.kind==='switch'){
    return `<div class="field"><label>${f.label}</label><select id="${prefix}${f.key}"><option value="1" ${val?'selected':''}>是</option><option value="0" ${!val?'selected':''}>否</option></select>${hint}</div>`;
  }
  if(f.kind==='textarea'){
    return `<div class="field"><label>${f.label}</label><textarea id="${prefix}${f.key}" placeholder="${f.placeholder||''}">${val}</textarea>${hint}</div>`;
  }
  if(f.kind==='number'){
    return `<div class="field"><label>${f.label}</label><input type="number" id="${prefix}${f.key}" placeholder="${f.placeholder||''}" value="${val}">${hint}</div>`;
  }
  if(f.kind==='codeMap'){
    return `<div class="field"><label>${f.label}</label><div id="${prefix}${f.key}">${codeMapRowsHtml(prefix + f.key)}</div>${hint}</div>`;
  }
  if(f.kind==='file'){
    return `<div class="field"><label>${f.label}</label><input type="file" id="${prefix}${f.key}">${val ? `<div class="hint">已选：${val}</div>` : ''}${hint}</div>`;
  }
  const inputType = f.secret ? 'password' : 'text';
  return `<div class="field"><label>${f.label}</label><input type="${inputType}" id="${prefix}${f.key}" placeholder="${f.placeholder||''}" value="${val}">${hint}</div>`;
}
function renderAdapterParams(){
  const impl = document.getElementById('f-adp-impl').value;
  const fields = ADAPTER_FIELDS[impl] || [];
  const id = document.getElementById('f-adp-id').value;
  const existing = id ? (state.adapters.find(x=>x.id===id)?.params || {}) : {};
  const box = document.getElementById('f-adp-params');
  if(!fields.length){
    box.innerHTML = '<div class="empty" style="padding:20px">该实现类无额外参数。</div>';
    return;
  }
  box.innerHTML = fields.map(f=>{
    const val = existing[f.key] !== undefined ? existing[f.key] : '';
    return paramFieldHtml(f, val, 'f-p-');
  }).join('');
}
function submitAdapter(){
  const id = document.getElementById('f-adp-id').value;
  const name = document.getElementById('f-adp-name').value.trim();
  const type = document.getElementById('f-adp-type').value;
  const impl = document.getElementById('f-adp-impl').value;
  const version = document.getElementById('f-adp-version').value.trim() || '1.0';
  if(!name){ alert('请填写适配器名称'); return; }
  const params = {};
  const existingParams = id ? (state.adapters.find(x=>x.id===id)?.params || {}) : {};
  (ADAPTER_FIELDS[impl]||[]).forEach(f=>{
    if(f.kind==='codeMap') return;
    const el = document.getElementById('f-p-'+f.key);
    if(!el) return;
    if(f.kind==='file'){ params[f.key] = (el.files && el.files[0]) ? el.files[0].name : (existingParams[f.key] || ''); return; }
    const raw = el.value;
    if(f.kind==='switch'){ params[f.key] = (raw==='1'); }
    else if(f.kind==='number'){ params[f.key] = raw==='' ? null : Number(raw); }
    else { params[f.key] = raw.trim(); }
  });
  if((ADAPTER_FIELDS[impl]||[]).some(f=>f.kind==='codeMap')){ params.codeMappings = codeMapList.map(m=>({...m})); }
  if(id){
    const a = state.adapters.find(x=>x.id===id);
    if(a){ Object.assign(a, { name, type, impl, version, enabled:adapterFormEnabled, params }); }
  } else {
    const maxId = state.adapters.reduce((m,x)=>Math.max(m, parseInt(x.id.replace('ADP-',''))||0), 0);
    state.adapters.push({ id:'ADP-'+String(maxId+1).padStart(3,'0'), name, type, impl, version, enabled:adapterFormEnabled, params });
  }
  closeModal(); renderAdapters();
}
function deleteAdapter(id){
  const a = state.adapters.find(x=>x.id===id);
  if(!a) return;
  if(!confirm(`确认删除适配器「${a.name}」？已引用它的接口/应用将失去该适配器。`)) return;
  state.adapters = state.adapters.filter(x=>x.id!==id);
  state.interfaces.forEach(i=>{
    ['protocolIn','protocolOut','message'].forEach(k=>{ if(i.adapters[k]===a.name) i.adapters[k]=null; });
    if(i.adapters.auth===a.name) i.adapters.auth=null;
    if(i.adapters.callbackAuth===a.name) i.adapters.callbackAuth=null;
  });
  state.apps.forEach(ap=>{ if(ap.authType===a.name) ap.authType='无鉴权'; if(ap.callbackAuthType===a.name) ap.callbackAuthType='无鉴权'; });
  renderAdapters();
}
function toggleAdapter(id){
  const a = state.adapters.find(x=>x.id===id);
  if(a){ a.enabled = !a.enabled; renderAdapters(); }
}

          <span class="node">MAPPING</span><span class="arr">→</span>
          <span class="node">SENDING</span><span class="arr">→</span>
          <span class="node core">SUCCESS</span>
        </div>
        <div class="chain">
          <span class="node end">SENDING</span><span class="arr">—5xx/429→</span>
          <span class="node">RETRYING</span><span class="arr">⇄</span>
          <span class="node end">SENDING</span>
          <span class="arr">耗尽→</span><span class="node">COMPENSATING</span><span class="arr">→</span><span class="node core">SUCCESS</span><span class="arr">/</span><span class="node">DEAD_LETTER</span>
        </div>
        <div class="chain">
          <span class="node end">SENDING</span><span class="arr">—4xx(非429)→</span><span class="node">DEAD_LETTER</span>
          <span class="arr">·</span>
          <span class="node end">SENDING</span><span class="arr">—超时/连接异常→</span><span class="node">UNKNOWN</span><span class="arr">—对账→</span><span class="node core">SUCCESS</span><span class="arr">/</span><span class="node">COMPENSATING</span>
        </div>
        <div style="padding:0 16px 14px;color:var(--muted);font-size:13px">
          熔断闸门位于 SENDING 前：OPEN 时直接转 COMPENSATING / DEAD_LETTER，不触发重试；补偿耗尽（超最大次数）→ DEAD_LETTER。
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>入站送达状态机（Flow B）</h3></div>
      <div class="panel-body">
        <div class="chain">
          <span class="node">RECEIVED</span><span class="arr">→</span>
          <span class="node core">ACKED</span>
        </div>
        <div class="chain">
          <span class="node end">RECEIVED</span><span class="arr">—送达失败→</span>
          <span class="node">PENDING</span><span class="arr">—补偿重送→</span>
          <span class="node core">ACKED</span><span class="arr">/</span><span class="node">DEAD_LETTER</span>
        </div>
        <div style="padding:0 16px 14px;color:var(--muted);font-size:13px">
          送达失败仍回供应商 ack（供应商不重发），由补偿 worker 重送至 ACKED；重送耗尽（超最大次数）→ DEAD_LETTER。
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>统一错误码（响应 { code, msg, data }，code=0 成功）</h3></div>
      <div class="panel-body">
        <table><thead><tr><th>code 段</th><th>含义</th><th>示例</th></tr></thead>
        <tbody>
          <tr><td>0</td><td>成功</td><td>—</td></tr>
          <tr><td>401xx</td><td>鉴权失败</td><td>40100 验签失败、40101 时间戳过期、40102 应用未启用</td></tr>
          <tr><td>400xx</td><td>参数 / 请求错误</td><td>40001 字段缺失、40002 报文格式非法</td></tr>
          <tr><td>404xx</td><td>资源不存在</td><td>40401 接口不存在、40402 应用不存在</td></tr>
          <tr><td>429xx</td><td>限流 / 配额</td><td>42901 QPS 限流、42902 日配额超限、42903 上游限流（透传上游 429）</td></tr>
          <tr><td>502xx</td><td>上游错误</td><td>50201 上游 5xx</td></tr>
          <tr><td>504xx</td><td>上游超时</td><td>50401 上游读超时</td></tr>
          <tr><td>500xx</td><td>平台内部错误</td><td>50000 未知异常</td></tr>
        </tbody></table>
        <div style="padding:0 18px 14px;color:var(--muted);font-size:13px">
          上游返回 429 属限流语义，归入 429xx（42903）；502xx 仅表示上游 5xx（网关错误）。
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>容错机制</h3></div>
      <div class="panel-body" style="padding:14px 18px;color:var(--muted);font-size:13px">
        <div class="keyval"><span class="k">重试</span><span class="v">5xx / 429 短重试（指数退避，未超上限回 SENDING）</span></div>
        <div class="keyval"><span class="k">熔断</span><span class="v">CLOSED → OPEN → HALF_OPEN；OPEN 快速失败，冷却后半开探测</span></div>
        <div class="keyval"><span class="k">补偿</span><span class="v">重试耗尽转 COMPENSATING，补偿 worker 定时扫描重放</span></div>
        <div class="keyval"><span class="k">死信</span><span class="v">4xx（非 429）落 dead_letter，不重试</span></div>
        <div class="keyval"><span class="k">对账</span><span class="v">超时 / 连接异常 → UNKNOWN，查询上游收敛 SUCCESS 或 COMPENSATING</span></div>
      </div>
    </div>`;
}

function nowStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function onAppAuthChange(){
  const isCustom = document.getElementById('f-app-auth').value === '__custom__';
  document.getElementById('f-app-auth-custom').style.display = isCustom ? 'block' : 'none';
  if(isCustom) renderAppAuthCustom();
}
function renderAppAuthCustom(){
  const box = document.getElementById('f-app-auth-custom');
  box.innerHTML = `
    <div class="field"><label>适配器名称</label><input id="f-app-auth-c-name" placeholder="如：我的 HMAC 鉴权"></div>
    <div class="field"><label>实现类</label><select id="f-app-auth-c-impl" onchange="renderAppAuthCustomParams()">${ADAPTER_IMPLS.auth.map(i=>`<option value="${i}">${i}</option>`).join('')}</select></div>
    <div id="f-app-auth-c-params"></div>

}
function renderAppAuthCustomParams(){
  const impl = document.getElementById('f-app-auth-c-impl').value;

function customAdapterField(type, selId, boxId, selected, leading){
  return `<select id="${selId}" onchange="onCustomAdapter('${type}','${selId}','${boxId}')">${leading||''}${adapterOpts(type, selected)}<option value="__custom__">＋ 自定义…</option></select><div id="${boxId}" class="params-panel" style="display:none;margin-top:10px"></div>`;
}
function onCustomAdapter(type, selId, boxId){
  const isCustom = document.getElementById(selId).value === '__custom__';
  document.getElementById(boxId).style.display = isCustom ? 'block' : 'none';
  if(isCustom) renderCustomAdapter(type, boxId);
}
function renderCustomAdapter(type, boxId){
  const box = document.getElementById(boxId);
  box.innerHTML = `
    <div class="field"><label>适配器名称</label><input id="${boxId}-name" placeholder="如：自定义适配器"></div>
    <div class="field"><label>实现类</label><select id="${boxId}-impl" onchange="renderCustomAdapterParams('${boxId}')">${ADAPTER_IMPLS[type].map(i=>`<option value="${i}">${i}</option>`).join('')}</select></div>
    <div id="${boxId}-params"></div>
    <div class="field" style="margin-bottom:0"><label style="font-weight:400;color:var(--muted);display:flex;align-items:center;gap:6px"><input type="checkbox" id="${boxId}-save" style="width:auto"> 保存为适配器（供其他复用）</label></div>`;
  codeMapList = [];
  renderCustomAdapterParams(boxId);
}
function renderCustomAdapterParams(boxId){
  const impl = document.getElementById(boxId + '-impl').value;
  const fields = ADAPTER_FIELDS[impl] || [];
  const box = document.getElementById(boxId + '-params');
  if(!fields.length){ box.innerHTML = '<div class="empty" style="padding:12px">该实现类无额外参数。</div>'; return; }
  box.innerHTML = fields.map(f=>paramFieldHtml(f, '', boxId + '-p-')).join('');
}
function commitCustomAdapter(type, boxId){
  const name = document.getElementById(boxId + '-name').value.trim();
  const impl = document.getElementById(boxId + '-impl').value;
  const save = document.getElementById(boxId + '-save').checked;
  if(!name){ alert('请填写适配器名称'); return ''; }
  const params = {};
  (ADAPTER_FIELDS[impl]||[]).forEach(f=>{
    if(f.kind==='codeMap') return;
    const el = document.getElementById(boxId + '-p-' + f.key);
    if(!el) return;
    if(f.kind==='file'){ params[f.key] = (el.files && el.files[0]) ? el.files[0].name : ''; return; }
    const raw = el.value;
    if(f.kind==='switch'){ params[f.key] = (raw==='1'); }
    else if(f.kind==='number'){ params[f.key] = raw==='' ? null : Number(raw); }
    else { params[f.key] = raw.trim(); }
  });
  if((ADAPTER_FIELDS[impl]||[]).some(f=>f.kind==='codeMap')){ params.codeMappings = codeMapList.map(m=>({...m})); }
  if(save){
    const maxId = state.adapters.reduce((m,x)=>Math.max(m, parseInt(x.id.replace('ADP-',''))||0), 0);
    state.adapters.push({ id:'ADP-'+String(maxId+1).padStart(3,'0'), name, type, impl, version:'1.0', enabled:true, params });
  }
  return name;
}
function submitApp(){
  const id = document.getElementById('f-app-id').value;
  const name = document.getElementById('f-app-name').value.trim();
  if(!name){ alert('请填写应用名称'); return; }
  let auth = document.getElementById('f-app-auth').value || '无鉴权';
  let callbackAuth = document.getElementById('f-app-callback-auth').value || '无鉴权';
  if(auth === '__custom__'){
    const cName = document.getElementById('f-app-auth-c-name').value.trim();
    const cImpl = document.getElementById('f-app-auth-c-impl').value;
    const saveAs = document.getElementById('f-app-auth-c-save').checked;
    if(!cName){ alert('请填写自定义鉴权适配器名称'); return; }
    const cParams = {};
    (ADAPTER_FIELDS[cImpl]||[]).forEach(f=>{
      const el = document.getElementById('f-acp-'+f.key);
      if(!el) return;
      if(f.kind==='file'){ cParams[f.key] = (el.files && el.files[0]) ? el.files[0].name : ''; return; }
      const raw = el.value;
      if(f.kind==='switch'){ cParams[f.key] = (raw==='1'); }
      else if(f.kind==='number'){ cParams[f.key] = raw==='' ? null : Number(raw); }
      else { cParams[f.key] = raw.trim(); }
    });
    if(saveAs){
      const maxId = state.adapters.reduce((m,x)=>Math.max(m, parseInt(x.id.replace('ADP-',''))||0), 0);
      state.adapters.push({ id:'ADP-'+String(maxId+1).padStart(3,'0'), name:cName, type:'auth', impl:cImpl, version:'1.0', enabled:true, params:cParams });
    }
    auth = cName;
  }
  const baseUrl = document.getElementById('f-app-base-url').value.trim();
  const ipWhitelist = document.getElementById('f-app-ip-wl').value.trim();
  const ipBlacklist = document.getElementById('f-app-ip-bl').value.trim();
  const desc = document.getElementById('f-app-desc').value.trim();
  const now = nowStr();
  if(id){
    const a = state.apps.find(x=>x.appId===id);
    if(a){ Object.assign(a, { name, baseUrl, authType:auth, callbackAuthType:callbackAuth, ipWhitelist, ipBlacklist, desc:desc||'—', updateTime:now }); }
  } else {
    const appId = 'APP-' + Math.random().toString(36).slice(2,7).toUpperCase();
    state.apps.push({ appId, name, baseUrl, authType:auth, callbackAuthType:callbackAuth, status:'草稿', secret:'sk_new_xxxx…', ipWhitelist, ipBlacklist, createTime:now, updateTime:now, desc:desc||'—', groups:[] });
  }
  closeModal(); navigate('apps');
}

function submitGroup(){
  const appId = document.getElementById('f-group-app').value;
  const oldName = document.getElementById('f-group-old').value;
  const name = document.getElementById('f-group-name').value.trim();
  if(!name){ alert('请填写分组名称'); return; }
  const app = state.apps.find(x=>x.appId===appId);
  if(oldName){
    if(oldName !== name){
      const g = app.groups.find(x=>x.name===oldName);
      if(g) g.name = name;
      state.interfaces.forEach(i=>{ if(i.appId===appId && i.group===oldName){ i.group = name; } });
    }
  } else {
    app.groups.push({ name, ifs:[] });
  }
  closeModal(); renderGroups();
}
function deleteGroup(appId, groupName){
  const app = state.apps.find(x=>x.appId===appId);
  const g = app && app.groups.find(x=>x.name===groupName);
  if(!app || !g) return;
  if(!confirm(`确认删除分组「${groupName}」？其下 ${g.ifs.length} 个接口将一并删除。`)) return;
  state.interfaces = state.interfaces.filter(i=>!(i.appId===appId && i.group===groupName));
  app.groups = app.groups.filter(x=>x.name!==groupName);
  renderGroups();
}

  populateGroups();
  if(i && i.group){ document.getElementById('f-if-group').value = i.group; }
  protoSame = i ? (i.protocolIn === i.protocolOut) : true;
  renderProtoSame();
  ifParams = i ? { inReq:(i.inReqParams||[]).map(r=>({...r})), outReq:(i.outReqParams||[]).map(r=>({...r})), outResp:(i.outRespFields||[]).map(r=>({...r})), ack:(i.ackFields||[]).map(r=>({...r})) } : { inReq:[], outReq:[], outResp:[], ack:[] };
  fieldMappings = i ? (i.fieldMappings||[]).map(r=>({...r})) : [];
  reqTab = { inReq:'params', outReq:'params' };
  ifBodies = { inReq: i && i.inBody ? { type:i.inBody.type||'none', raw:i.inBody.raw||'', form:(i.inBody.form||[]).map(f=>({...f})) } : { type:'none', raw:'', form:[] }, outReq: i && i.outBody ? { type:i.outBody.type||'none', raw:i.outBody.raw||'', form:(i.outBody.form||[]).map(f=>({...f})) } : { type:'none', raw:'', form:[] } };
  renderReqSide('inReq');
  renderReqSide('outReq');
  renderRespList('outResp');
  renderRespList('ack');
  renderFieldMappings();
  onIfTypeChange();
}
function populateGroups(){
  const appId = document.getElementById('f-if-app').value;
  const app = state.apps.find(x=>x.appId===appId);
  const sel = document.getElementById('f-if-group');
  if(!app){ sel.innerHTML = '<option value="">— 请先选应用 —</option>'; return; }
  if(app.groups.length===0){ sel.innerHTML = '<option value="">— 该应用暂无分组 —</option>'; return; }
  sel.innerHTML = app.groups.map(g=>`<option value="${g.name}">${g.name}</option>`).join('');
}
let protoSame = true;
function renderProtoSame(){
  const box = document.getElementById('f-proto-same');
  box.innerHTML = `<button type="button" class="switch ${protoSame?'on':''}" onclick="toggleProtoSame()"><span class="knob"></span><span class="lbl">${protoSame?'与入站协议一致':'独立选择'}</span></button>`;
  const out = document.getElementById('f-if-proto-out');
  out.disabled = protoSame;
  if(protoSame) out.value = document.getElementById('f-if-proto-in').value;
}
function toggleProtoSame(){
  protoSame = !protoSame;
  renderProtoSame();
}
function onProtoInChange(){
  if(protoSame){
    document.getElementById('f-if-proto-out').value = document.getElementById('f-if-proto-in').value;
  }
}
function protoAdapterName(proto){
  const impl = proto==='XML' ? 'XmlProtocolAdapter' : 'JsonProtocolAdapter';
  const a = state.adapters.find(x=>x.type==='protocol' && x.enabled && x.impl===impl);
  return a ? a.name : impl;
}
let ifParams = { inReq:[], outReq:[], outResp:[], ack:[] };
const IF_PARAM_BOX = { inReq:'f-if-req-in', outReq:'f-if-req-out', outResp:'f-if-resp-out', ack:'f-if-ack' };
const PARAM_TYPES = ['string','number','boolean','object','array'];
let reqTab = { inReq:'params', outReq:'params' };
let ifBodies = { inReq:{ type:'none', raw:'', form:[] }, outReq:{ type:'none', raw:'', form:[] } };
const BODY_TYPES = ['none','form-data','x-www-form-urlencoded','json','xml'];
function renderReqSide(key){
  const box = document.getElementById(IF_PARAM_BOX[key]);
  const tab = reqTab[key];
  box.innerHTML = `
    <div class="tabs" style="padding:0;margin-bottom:8px">
      <button type="button" class="tab ${tab==='params'?'active':''}" onclick="switchReqTab('${key}','params')">Params</button>
      <button type="button" class="tab ${tab==='body'?'active':''}" onclick="switchReqTab('${key}','body')">Body</button>
    </div>
    ${tab==='params' ? reqParamsTableHtml(key) : bodyEditorHtml(key)}`;
}
function switchReqTab(key, tab){ reqTab[key] = tab; renderReqSide(key); }
function reqParamsTableHtml(key){
  const list = ifParams[key];
  const rows = list.map((r,i)=>`
    <tr>
      <td><input value="${r.name}" onchange="onReqParamChange('${key}',${i},'name',this.value)"></td>
      <td><select onchange="onReqParamChange('${key}',${i},'type',this.value)">${PARAM_TYPES.map(t=>`<option value="${t}" ${r.type===t?'selected':''}>${t}</option>`).join('')}</select></td>
      <td><select onchange="onReqParamChange('${key}',${i},'required',this.value)"><option value="1" ${r.required?'selected':''}>必填</option><option value="0" ${!r.required?'selected':''}>可选</option></select></td>
      <td><input value="${r.sample}" placeholder="示例值" onchange="onReqParamChange('${key}',${i},'sample',this.value)"></td>
      <td style="width:40px;text-align:center"><button type="button" class="btn sm danger" onclick="removeReqParam('${key}',${i})">×</button></td>
    </tr>`).join('');
  return `
    <table class="mt">
      <thead><tr><th style="width:26%">参数名</th><th style="width:18%">类型</th><th style="width:14%">必填</th><th>示例值</th><th style="width:40px"></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:16px">暂无参数</td></tr>`}</tbody>
    </table>
    <button type="button" class="btn sm ghost" onclick="addReqParam('${key}')" style="margin-top:8px">＋ 添加参数</button>`;
}
function bodyEditorHtml(key){
  const b = ifBodies[key];
  let editor = '';
  if(b.type === 'none'){
    editor = `<div class="empty" style="padding:16px">无请求体</div>`;
  } else if(b.type === 'json' || b.type === 'xml'){
    editor = `<textarea class="btextarea" rows="5" placeholder="${b.type==='json'?'{\n  "key": "value"\n}':'<root></root>'}" oninput="onBodyRawChange('${key}',this.value)">${b.raw}</textarea>`;
  } else {
    const rows = b.form.map((f,i)=>`
      <tr>
        <td><input value="${f.key}" placeholder="键" onchange="onBodyFormChange('${key}',${i},'key',this.value)"></td>
        <td><input value="${f.value}" placeholder="值" onchange="onBodyFormChange('${key}',${i},'value',this.value)"></td>
        <td style="width:40px;text-align:center"><button type="button" class="btn sm danger" onclick="removeBodyForm('${key}',${i})">×</button></td>
      </tr>`).join('');
    editor = `
      <table class="mt">
        <thead><tr><th style="width:40%">键</th><th>值</th><th style="width:40px"></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:16px">暂无字段</td></tr>`}</tbody>
      </table>
      <button type="button" class="btn sm ghost" onclick="addBodyForm('${key}')" style="margin-top:8px">＋ 添加</button>`;
  }
  return `
    <div class="tabs" style="padding:0;margin-bottom:8px">
      ${BODY_TYPES.map(t=>`<button type="button" class="tab sm ${b.type===t?'active':''}" onclick="onBodyTypeChange('${key}','${t}')">${t}</button>`).join('')}
    </div>
    ${editor}`;
}
function onBodyTypeChange(key, type){ ifBodies[key].type = type; renderReqSide(key); }
function onBodyRawChange(key, val){ ifBodies[key].raw = val; }
function addBodyForm(key){ ifBodies[key].form.push({ key:'', value:'' }); renderReqSide(key); }
function removeBodyForm(key, i){ ifBodies[key].form.splice(i,1); renderReqSide(key); }
function onBodyFormChange(key, i, field, val){ ifBodies[key].form[i][field] = val; }
function addReqParam(key){ ifParams[key].push({ name:'', type:'string', required:false, sample:'' }); renderReqSide(key); renderFieldMappings(); }
function removeReqParam(key, i){ ifParams[key].splice(i,1); renderReqSide(key); renderFieldMappings(); }
function onReqParamChange(key, i, field, val){ ifParams[key][i][field] = (field==='required') ? (val==='1') : val; }
function renderRespList(key){
  const box = document.getElementById(IF_PARAM_BOX[key]);
  const list = ifParams[key];
  const rows = list.map((r,i)=>`
    <tr>
      <td><input value="${r.name}" onchange="onRespFieldChange('${key}',${i},'name',this.value)"></td>
      <td><select onchange="onRespFieldChange('${key}',${i},'type',this.value)">${PARAM_TYPES.map(t=>`<option value="${t}" ${r.type===t?'selected':''}>${t}</option>`).join('')}</select></td>
      <td><input value="${r.desc}" placeholder="可选" onchange="onRespFieldChange('${key}',${i},'desc',this.value)"></td>
      <td style="width:40px;text-align:center"><button type="button" class="btn sm danger" onclick="removeRespField('${key}',${i})">×</button></td>
    </tr>`).join('');
  box.innerHTML = `
    <table class="mt">
      <thead><tr><th style="width:30%">字段名</th><th style="width:18%">类型</th><th>说明</th><th style="width:40px"></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:16px">暂无字段</td></tr>`}</tbody>
    </table>
    <button type="button" class="btn sm ghost" onclick="addRespField('${key}')" style="margin-top:8px">＋ 添加字段</button>`;
}
function addRespField(key){ ifParams[key].push({ name:'', type:'string', desc:'' }); renderRespList(key); }
function removeRespField(key, i){ ifParams[key].splice(i,1); renderRespList(key); }
function onRespFieldChange(key, i, field, val){ ifParams[key][i][field] = val; }
let fieldMappings = [];
const MAP_OPS = { rename:'重命名', typeCast:'类型转换', enumMap:'枚举映射', default:'默认值', condition:'条件', aggregate:'聚合' };
const MAP_NULL = { KEEP:'保留原值', NULL:'置空', DEFAULT:'默认值', ERROR:'报错' };
function mapOpParamMeta(op){
  switch(op){
    case 'typeCast': return { kind:'select', options:['STRING','INT','DECIMAL','DATE','BOOL'] };
    case 'enumMap':  return { kind:'text', placeholder:'PENDING→0, DONE→1' };
    case 'default':  return { kind:'text', placeholder:'默认值' };
    case 'condition':return { kind:'text', placeholder:'amount > 0' };
    case 'aggregate':return { kind:'select', options:['CONCAT','SUM','MAX','MIN'] };
    default: return null;
  }
}
function reqParamNames(key){
  return ifParams[key].map(p=>p.name.trim()).filter(Boolean);
}
function renderFieldMappings(){
  const box = document.getElementById('f-if-field-maps');
  const inNames = reqParamNames('inReq');
  const outNames = reqParamNames('outReq');
  const rows = fieldMappings.map((m,i)=>{
    const meta = mapOpParamMeta(m.op);
    const paramCell = meta
      ? (meta.kind==='select'
          ? `<select onchange="onFieldMapChange(${i},'param',this.value)">${meta.options.map(o=>`<option value="${o}" ${m.param===o?'selected':''}>${o}</option>`).join('')}</select>`
          : `<input placeholder="${meta.placeholder||''}" value="${m.param||''}" onchange="onFieldMapChange(${i},'param',this.value)">`)
      : '<span style="color:var(--muted)">—</span>';
    return `
    <tr>
      <td><select onchange="onFieldMapChange(${i},'source',this.value)"><option value="">— 选入站字段 —</option>${inNames.map(n=>`<option value="${n}" ${m.source===n?'selected':''}>${n}</option>`).join('')}</select></td>
      <td><select onchange="onFieldMapChange(${i},'op',this.value)">${Object.entries(MAP_OPS).map(([v,l])=>`<option value="${v}" ${m.op===v?'selected':''}>${l}</option>`).join('')}</select></td>
      <td><select onchange="onFieldMapChange(${i},'target',this.value)"><option value="">— 选出站字段 —</option>${outNames.map(n=>`<option value="${n}" ${m.target===n?'selected':''}>${n}</option>`).join('')}</select></td>
      <td>${paramCell}</td>
      <td><select onchange="onFieldMapChange(${i},'nullStrategy',this.value)">${Object.keys(MAP_NULL).map(k=>`<option value="${k}" ${m.nullStrategy===k?'selected':''}>${MAP_NULL[k]}</option>`).join('')}</select></td>
      <td style="width:40px;text-align:center"><button type="button" class="btn sm danger" onclick="removeFieldMap(${i})">×</button></td>
    </tr>`;
  }).join('');
  box.innerHTML = `
    <table class="mt">
      <thead><tr><th>入站字段</th><th>操作</th><th>出站字段</th><th>操作参数</th><th>空值策略</th><th style="width:40px"></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:16px">暂无映射，点下方「添加映射」</td></tr>`}</tbody>
    </table>
    <button type="button" class="btn sm ghost" onclick="addFieldMap()" style="margin-top:8px">＋ 添加映射</button>`;
}
function addFieldMap(){ fieldMappings.push({ source:'', op:'rename', target:'', param:'', nullStrategy:'KEEP' }); renderFieldMappings(); }
function removeFieldMap(i){ fieldMappings.splice(i,1); renderFieldMappings(); }
function onFieldMapChange(i, key, val){ fieldMappings[i][key] = val; if(key==='op'){ fieldMappings[i].param = ''; renderFieldMappings(); } }
function deleteInterface(id){
  const it = state.interfaces.find(x=>x.id===id);
  if(!it) return;
  if(!confirm(`确认删除接口「${it.name}」？`)) return;
  state.interfaces = state.interfaces.filter(x=>x.id!==id);
  state.apps.forEach(a=>a.groups.forEach(g=>{ g.ifs = g.ifs.filter(x=>x!==id); }));
  if(currentIfId===id){ currentIfId=null; }
  renderInterfaces();
}
function toggleAdvConfig(){
  const el = document.getElementById('f-if-adv');
  el.style.display = el.style.display==='none' ? 'block' : 'none';
}
function helpMark(text){
  return `<span class="qmark" tabindex="0" onclick="this.classList.toggle('open')" onfocus="this.classList.add('open')" onblur="this.classList.remove('open')">?<span class="tip">${text}</span></span>`;
}
function onIfTypeChange(){
  const inbound = document.getElementById('f-if-type').value === 'inbound';
  const label = document.getElementById('f-if-target-label');
  const input = document.getElementById('f-if-target-path');
  if(label){ label.textContent = inbound ? '回调地址' : '上游路径'; }
  if(input){ input.placeholder = inbound ? '如 http://localhost:9000/webhook' : '/order'; }
  document.getElementById('f-if-resp-out-area').style.display = inbound ? 'none' : '';
  document.getElementById('f-if-ack-area').style.display = inbound ? '' : 'none';
  document.getElementById('f-if-sign-auth-area').style.display = inbound ? 'none' : '';
  document.getElementById('f-if-callback-auth-area').style.display = inbound ? '' : 'none';
}
function submitInterface(){
  const id = document.getElementById('f-if-id').value;
  const name = document.getElementById('f-if-name').value.trim();
  const path = document.getElementById('f-if-path').value.trim();
  const appId = document.getElementById('f-if-app').value;
  const group = document.getElementById('f-if-group').value;
  const targetPath = document.getElementById('f-if-target-path').value.trim();
  if(!name || !path){ alert('请填写接口名称与路径'); return; }
  if(!appId || !group){ alert('请选择应用与分组'); return; }
  const ifType = document.getElementById('f-if-type').value;
  if(!targetPath){ alert(ifType==='inbound' ? '请填写回调地址' : '请填写上游路径'); return; }
  const badMap = fieldMappings.findIndex(m => !m.target || (m.op !== 'default' && !m.source));
  if(badMap >= 0){ alert(`第 ${badMap+1} 条字段映射缺少入站/出站字段`); return; }
  const method = document.getElementById('f-if-method').value;
  const protoIn = document.getElementById('f-if-proto-in').value;
  const protoOut = document.getElementById('f-if-proto-out').value;
  const desc = document.getElementById('f-if-desc').value.trim();
  const timeout = parseInt(document.getElementById('f-if-timeout').value) || 3000;
  const retries = parseInt(document.getElementById('f-if-retries').value) || 0;
  let adpMsg = document.getElementById('f-adp-msg').value;
  if(adpMsg === '__custom__'){ adpMsg = commitCustomAdapter('message', 'f-cust-msg'); }
  let adpAuth = document.getElementById('f-adp-auth').value;
  if(adpAuth === '__custom__'){ adpAuth = commitCustomAdapter('auth', 'f-cust-auth'); }
  let adpCallbackAuth = document.getElementById('f-adp-callback-auth').value;
  if(adpCallbackAuth === '__custom__'){ adpCallbackAuth = commitCustomAdapter('auth', 'f-cust-callback-auth'); }
  const data = {
    name, path, method, ifType, desc:desc||'—', protocolIn:protoIn, protocolOut:protoOut, appId, group,
    upstreamPath: ifType==='outbound' ? targetPath : '',
    deliveryUrl: ifType==='inbound' ? targetPath : '',
    inReqParams:ifParams.inReq.map(r=>({...r})), outReqParams:ifParams.outReq.map(r=>({...r})),
    inBody:{ ...ifBodies.inReq, form:ifBodies.inReq.form.map(f=>({...f})) },
    outBody:{ ...ifBodies.outReq, form:ifBodies.outReq.form.map(f=>({...f})) },
    outRespFields: ifType==='outbound' ? ifParams.outResp.map(r=>({...r})) : [],
    ackFields: ifType==='inbound' ? ifParams.ack.map(r=>({...r})) : [],
    fieldMappings:fieldMappings.map(r=>({...r})),
    adapters:{ protocolIn:protoAdapterName(protoIn), protocolOut:protoAdapterName(protoOut), message:adpMsg, auth: ifType==='outbound' ? (adpAuth || null) : null, callbackAuth: ifType==='inbound' ? (adpCallbackAuth || null) : null },
    config:{ timeout, retries }
  };
  if(id){
    const it = state.interfaces.find(x=>x.id===id);
    if(it){
      state.apps.forEach(a=>a.groups.forEach(g=>{ g.ifs = g.ifs.filter(x=>x!==id); }));
      Object.assign(it, data);
      const app = state.apps.find(x=>x.appId===appId);
      const g = app && app.groups.find(x=>x.name===group);
      if(g) g.ifs.push(id);
    }
  } else {
    const nid = 'IF' + String(state.interfaces.length+1).padStart(3,'0');
    state.interfaces.push(Object.assign({ id:nid, status:'草稿' }, data));
    const app = state.apps.find(x=>x.appId===appId);
    const g = app && app.groups.find(x=>x.name===group);
    if(g) g.ifs.push(nid);
  }
  closeModal(); navigate('interfaces');
}

function statusBadge(s){
  const map = { '启用':'success', '已发布':'success', '草稿':'gray', '停用':'danger', '注销':'gray', '下线':'danger' };
  return `<span class="badge ${map[s]||'gray'}">${s}</span>`;
}

/* ===== 启动 ===== */
navigate('dashboard');
</script>
</body>
