spring:
  application:
    name: apicenter
  datasource:
    # API 中心 · MySQL（PolarDB，MySQL 5.7/8.0 双兼容）。建库脚本：doc/schema.sql（16 张表，已双兼容）
    # 安全建议：提交前将密码改为环境变量占位，如 password: ${APICENTER_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://alicloud.mysql.polardb.rds.aliyuncs.com:3306/apicenter?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false
    username: rootuser
    password: "mysql1qaz!QAZ"

server:
  port: 8080

# API 中心运行参数（业务配置全部落库，此处仅基础设施参数）
app:
  api-center:
    # 补偿 worker 扫描间隔（设计 §6.3：按 (status, next_retry_at) 扫描 COMPENSATING / PENDING 记录）
    retry-worker-fixed-delay-ms: 3000
    # 进入平台的请求体大小上限（M0-03 §1.3，默认 1MB，超限 40002；出站请求与入站回调双向生效）
    max-body-bytes: 1048576
    # 回调地址允许内网 / 回环地址（SSRF 防护开关，M3 交付；开发 / 测试依赖本地 WireMock 为 true，
    # 生产必须 false——同时作用于管理面保存校验与运行时送达兜底）
    callback-allow-private: true
    # UNKNOWN 超时自动降级为 COMPENSATING 的时长（M0-03 §3.1，M4 实现）
    unknown-ttl-minutes: 10
    crypto:
      # 凭证 AES-256-GCM 密钥（base64 编码 32 字节）。仅开发环境使用；
      # 生产环境用环境变量 APICENTER_CRYPTO_KEY 注入，密钥缺失时启动失败（拒绝明文裸跑）
      key: 2GHh50tyXqbkjFfiK5EziVKC0uLayvJVO8DbQGEtviM=
    seed:
      # 启动时幂等导入 fastmoss 黄金用例种子（检测已存在则跳过）
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
