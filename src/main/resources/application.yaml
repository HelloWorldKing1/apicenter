spring:
  application:
    name: apicenter
  datasource:
    # API 中心 · MySQL（PolarDB）。建库脚本：doc/schema.sql（15 张表，已执行）
    # 安全建议：提交前将密码改为环境变量占位，如 password: ${APICENTER_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://pritechdb123.mysql.polardb.rds.aliyuncs.com:3306/apicenter?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false
    username: pritechroot
    password: Pritech123!

server:
  port: 8080

# API 中心运行参数（业务配置全部落库，此处仅基础设施参数）
app:
  api-center:
    # 补偿 worker 扫描间隔（设计 §6.3：按 (status, next_retry_at) 扫描 COMPENSATING / PENDING 记录）
    retry-worker-fixed-delay-ms: 3000
    # UNKNOWN 超时自动降级为 COMPENSATING 的时长（M0-03 §3.1，M4 实现）
    unknown-ttl-minutes: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
